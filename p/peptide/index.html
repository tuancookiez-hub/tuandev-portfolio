async function unlock(){
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  try{
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:Uint8Array.from(atob(P.s), c=>c.charCodeAt(0)), iterations:250000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:Uint8Array.from(atob(P.i), c=>c.charCodeAt(0))}, key, Uint8Array.from(atob(P.c), c=>c.charCodeAt(0)));
    document.open(); document.write(new TextDecoder().decode(plain)); document.close();
  }catch(e){ err.textContent = 'Wrong passphrase'; }
}
