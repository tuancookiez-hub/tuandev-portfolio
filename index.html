  <!-- Mobile responsive overrides -->
  <style>
    @media (max-width: 767px) {
      /* Hide sidebar by default on mobile */
      aside[class*="fixed"] {
        transform: translateX(-100%) !important;
        width: 280px !important;
        max-width: 85vw !important;
        transition: transform 0.3s ease !important;
        z-index: 9999 !important;
      }
      /* Remove sidebar margin from main content */
      main[class*="ml-"] {
        margin-left: 0 !important;
        padding-left: 1.25rem !important;
        padding-right: 1.25rem !important;
      }
      /* Hamburger button */
      #mobile-toggle {
        display: block;
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10000;
        width: 40px;
        height: 40px;
        background: rgba(13,13,13,0.9);
        border: 1px solid rgba(230,225,216,0.15);
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #E6E1D8;
        font-size: 20px;
        line-height: 1;
        backdrop-filter: blur(8px);
      }
      #mobile-toggle::before { content: "☰"; }
      /* Sidebar open state */
      #sidebar-check:checked ~ #root aside[class*="fixed"] {
        transform: translateX(0) !important;
      }
      /* Overlay behind open sidebar */
      #sidebar-check:checked ~ #root .mobile-overlay {
        display: block;
      }
      .mobile-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        z-index: 9998;
      }
      #sidebar-check:checked ~ #mobile-toggle::before { content: "✕"; }
    }
    /* Editorial card (Facade of Jade + HyAtlas collapsed) — stack on mobile */
    @media (max-width: 767px) {
      .cf-collapsed {
        grid-template-columns: 1fr !important;
        min-height: 0 !important;
      }
      .cf-image-col {
        aspect-ratio: 16 / 10 !important;
        min-height: 200px !important;
        max-height: 240px !important;
      }
      .cf-text-col {
        padding: 24px 20px !important;
      }
      .cf-title {
        font-size: 26px !important;
        gap: 10px !important;
      }
      .cf-ornament {
        font-size: 14px !important;
      }
      .cf-description {
        font-size: 15px !important;
        line-height: 1.5 !important;
        margin-bottom: 14px !important;
      }
      .cf-tags {
        font-size: 9px !important;
        margin-bottom: 10px !important;
        letter-spacing: 0.15em !important;
      }
      .cf-expanded-content {
        padding: 22px 20px 28px 20px !important;
      }
      .cf-expanded-body {
        font-size: 15px !important;
        line-height: 1.55 !important;
        margin-bottom: 18px !important;
      }
      .cf-bullets {
        font-size: 10px !important;
        line-height: 1.75 !important;
        margin-bottom: 18px !important;
      }
    }
    @media (min-width: 768px) {
      #mobile-toggle { display: none; }
      .mobile-overlay { display: none; }
    }

    /* Click to expand glow animation */
    @keyframes glow-pulse {
      0%, 100% { color: #E6E10B; text-shadow: 0 0 8px rgba(230,225,11,0.6), 0 0 20px rgba(230,225,11,0.3); }
      50% { color: #f0eb30; text-shadow: 0 0 15px rgba(230,225,11,0.9), 0 0 35px rgba(230,225,11,0.5), 0 0 50px rgba(230,225,11,0.2); }
    }
    .glow-cta {
      animation: glow-pulse 2s ease-in-out infinite;
      font-weight: 600;
      letter-spacing: 0.15em;
    }
    /* Philosophy section removed */
    section.relative.py-32 { display: none !important; }
  </style>

<body>
  <input type="checkbox" id="sidebar-check" style="display:none">
  <label for="sidebar-check" id="mobile-toggle"></label>
  <div id="root"></div>
  <script>
    (function() {
      function init() {
        var root = document.getElementById('root');
        if (!root) return;
        var overlay = document.createElement('div');
        overlay.className = 'mobile-overlay';
        root.appendChild(overlay);
        overlay.addEventListener('click', function() {
          document.getElementById('sidebar-check').checked = false;
        });
        root.addEventListener('click', function(e) {
          var link = e.target.closest('a[href^="#"]');
          if (link && window.innerWidth < 768) {
            document.getElementById('sidebar-check').checked = false;
          }
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() { setTimeout(init, 100); });
      } else {
        setTimeout(init, 100);
      }
    })();
  </script>
  <script>
    (function() {
      function applyGlow() {
        var spans = document.querySelectorAll('span');
        for (var i = 0; i < spans.length; i++) {
          if (spans[i].textContent.indexOf('Click to expand') !== -1 && !spans[i].classList.contains('glow-cta')) {
            spans[i].classList.add('glow-cta');
          }
        }
      }
      var observer = new MutationObserver(applyGlow);
      var root = document.getElementById('root');
      if (root) {
        observer.observe(root, { childList: true, subtree: true });
        setTimeout(applyGlow, 500);
      }
    })();
  </script>
