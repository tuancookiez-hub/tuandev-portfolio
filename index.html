<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuan Dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;1,400;1,600&family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Image Preloads -->
  <link rel="preload" as="image" href="./eye-anime.png">
  <link rel="preload" as="image" href="./hero-anime.png">
  <link rel="preload" as="image" href="./hero-scholar.png">
  <link rel="preload" as="image" href="./project-nous.jpg">
  <link rel="preload" as="image" href="./eye-gold.jpg">
  <link rel="preload" as="image" href="./globe-warm.jpg">
  <link rel="preload" as="image" href="./hero-anime.jpg">
  <link rel="preload" as="image" href="./hero-figure.jpg">
  <link rel="preload" as="image" href="./hero-statue.jpg">
  <link rel="preload" as="image" href="./nike-warm.jpg">

  <script type="module" crossorigin src="./assets/index-Cxo0TDFR.js?v=3"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B8HEXiM_.css?v=3">

  <!-- Music autoload on first user interaction -->
  <script>
    (function() {
      var audio = new Audio('./bg-music.mp3');
      audio.loop = true;
      audio.volume = 0.35;
      window._bgAudio = audio;
      var started = false;
      document.addEventListener('click', function() {
        if (!started) { audio.play(); started = true; }
      }, { once: true });
      document.addEventListener('visibilitychange', function() {
        if (!started) return;
        if (document.hidden) audio.pause();
        else if (!audio.muted) audio.play();
      });
    })();
  </script>

  <!-- Mute button -->
  <style>
    #mute-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 99990;
      width: 36px;
      height: 36px;
      background: rgba(13,13,13,0.85);
      border: 1px solid rgba(230,225,216,0.15);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #E6E1D8;
      font-size: 16px;
      line-height: 1;
      backdrop-filter: blur(8px);
      transition: opacity 0.3s;
      opacity: 0.5;
    }
    #mute-btn:hover { opacity: 1; border-color: rgba(230,225,216,0.4); }
  </style>

  <!-- Mobile responsive overrides -->
  <style>
    @media (max-width: 767px) {
      /* Hide sidebar by default on mobile */
      aside[class*="fixed"] {
        transform: translateX(-100%) !important;
        width: 280px !important;
        max-width: 85vw !important;
        transition: transform 0.3s ease !important;
        z-index: 9999 !important;
      }
      /* Remove sidebar margin from main content */
      main[class*="ml-"] {
        margin-left: 0 !important;
        padding-left: 1.25rem !important;
        padding-right: 1.25rem !important;
      }
      /* Hamburger button */
      #mobile-toggle {
        display: block;
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10000;
        width: 40px;
        height: 40px;
        background: rgba(13,13,13,0.9);
        border: 1px solid rgba(230,225,216,0.15);
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #E6E1D8;
        font-size: 20px;
        line-height: 1;
        backdrop-filter: blur(8px);
      }
      #mobile-toggle::before { content: "☰"; }
      /* Sidebar open state */
      #sidebar-check:checked ~ #root aside[class*="fixed"] {
        transform: translateX(0) !important;
      }
      /* Overlay behind open sidebar */
      #sidebar-check:checked ~ #root .mobile-overlay {
        display: block;
      }
      .mobile-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        z-index: 9998;
      }
      #sidebar-check:checked ~ #mobile-toggle::before { content: "✕"; }
    }
    @media (min-width: 768px) {
      #mobile-toggle { display: none; }
      .mobile-overlay { display: none; }
    }
  </style>
</head>
<body>
  <input type="checkbox" id="sidebar-check" style="display:none">
  <label for="sidebar-check" id="mobile-toggle"></label>
  <button id="mute-btn" title="Toggle music">🔊</button>
  <div id="root"></div>
  <script>
    (function() {
      var btn = document.getElementById('mute-btn');
      var muted = false;
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var audio = window._bgAudio;
        if (!audio) return;
        muted = !muted;
        audio.muted = muted;
        btn.textContent = muted ? '🔇' : '🔊';
      });
    })();
  </script>
  <script>
    (function() {
      function init() {
        var root = document.getElementById('root');
        if (!root) return;
        var overlay = document.createElement('div');
        overlay.className = 'mobile-overlay';
        root.appendChild(overlay);
        overlay.addEventListener('click', function() {
          document.getElementById('sidebar-check').checked = false;
        });
        root.addEventListener('click', function(e) {
          var link = e.target.closest('a[href^="#"]');
          if (link && window.innerWidth < 768) {
            document.getElementById('sidebar-check').checked = false;
          }
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() { setTimeout(init, 100); });
      } else {
        setTimeout(init, 100);
      }
    })();
  </script>
</body>
</html>
